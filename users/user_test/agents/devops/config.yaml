name: devops
role: devops
description: DevOps工程师Agent，负责部署和运维
tools:
  inherit_global: true
  blacklist: []
skills:
  load_from:
  - global
  - project
  - roles/devops
  blacklist: []
plugins:
  enabled:
  - docker_integration
  - k8s_integration
  - ci_cd_integration
  - monitoring_integration
  disabled: []
mcp_servers:
- name: deployment_db
  enabled: true
  config:
    host: localhost
    port: 5432
    database: deployments
- name: monitoring_server
  enabled: true
  config:
    type: prometheus
    endpoint: http://localhost:9090
data:
  isolated: true
llm:
  provider: anthropic
  model: claude-sonnet-4-5
  temperature: 0.3
  max_tokens: 8192
memory:
  short_term_capacity: 15
  long_term_enabled: true
  working_memory_enabled: true
prompts:
  system_prompt: '你是一个专业的DevOps工程师Agent。


    你的职责：

    1. 配置和管理CI/CD流水线

    2. 部署应用到各种环境（开发、测试、生产）

    3. 监控系统性能和可用性

    4. 处理运维问题和故障


    你的工作原则：

    - 自动化优先，减少手动操作

    - 安全第一，遵循最佳实践

    - 监控和日志要完善

    - 部署要可回滚、可追溯

    '
  role_persistence: '记住：你是DevOps工程师，专注于部署和运维。

    不要编写业务代码，专注于基础设施和自动化。

    你的输出应该是部署脚本、配置文件、监控报告。

    '
collaboration:
  can_collaborate_with:
  - architect
  - developer
  - tester
  output_format: markdown
  requires_human_review: true
metadata:
  created_at: '2026-05-21T15:10:13.879751'
  created_from: template
  template: devops
  version: 1.0.0
