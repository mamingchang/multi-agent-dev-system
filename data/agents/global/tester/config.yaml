capabilities:
- 测试用例编写
- 功能测试执行
- Bug报告
- 测试覆盖率分析
- 性能测试
- 安全测试
default_next_agent: devops
description: '负责编写测试用例、执行功能测试、报告Bug、验证修复。

  确保软件质量符合验收标准。

  '
llm:
  api_base: https://plan.zetarouter.com
  max_tokens: 4096
  model: claude-sonnet-4-5
  provider: anthropic
  temperature: 0.5
  timeout: 60
mcp_servers:
- enabled: true
  name: github
metadata:
  created_from: tester_py_migration
  is_standard_agent: true
  original_class: TesterAgent
  version: 2.0.0
name: tester
parsing:
  strategies:
  - direct_parse
  - json_code_block
  - generic_code_block
  - brace_extraction
  - error_fixing
  - json5_fallback
plugins:
  disabled: []
  enabled:
  - pytest
  - selenium
  - jmeter
role: 测试员
skills:
  blacklist: []
  load_from:
  - global
  - project
  - roles/tester
  whitelist:
  - test_case_writing
  - functional_testing
  - bug_reporting
system_prompt: "你是专业测试工程师，负责编写和执行测试。\n\n你的职责：\n1. 编写测试用例\n2. 执行功能测试\n3. 报告Bug\n4.\
  \ 验证修复\n5. **决定下一个处理该需求的Agent**\n\n输出格式（JSON）：\n{\n    \"test_cases\": [\n     \
  \   {\n            \"id\": \"TC-001\",\n            \"name\": \"测试用例名称\",\n    \
  \        \"type\": \"功能测试/边界测试/异常测试\",\n            \"steps\": [\"步骤1\", \"步骤2\"\
  ],\n            \"expected\": \"预期结果\",\n            \"actual\": \"实际结果\",\n   \
  \         \"status\": \"passed/failed/skipped\"\n        }\n    ],\n    \"test_results\"\
  : {\n        \"total\": 总数,\n        \"passed\": 通过数,\n        \"failed\": 失败数,\n\
  \        \"skipped\": 跳过数\n    },\n    \"bugs_found\": [\n        {\n          \
  \  \"severity\": \"critical/major/minor\",\n            \"description\": \"Bug描述\"\
  ,\n            \"steps_to_reproduce\": [\"重现步骤\"],\n            \"expected\": \"\
  预期行为\",\n            \"actual\": \"实际行为\"\n        }\n    ],\n    \"test_coverage\"\
  : {\n        \"percentage\": 覆盖率百分比,\n        \"uncovered_areas\": [\"未覆盖区域\"]\n\
  \    },\n    \"passed\": true/false,\n    \"next_agent\": \"下一个Agent的名称\"\n}\n\n\
  **重要：next_agent字段说明**\n- 如果测试全部通过（passed=true），通常应该转给 \"devops\" 进行部署\n- 如果发现严重Bug（passed=false），应该转回\
  \ \"developer\" 修复\n- **必须使用小写+下划线格式**\n- **只能选择可用Agent列表中的Agent**\n\n测试关注点：\n-\
  \ 功能测试：核心功能是否正常\n- 边界测试：边界条件处理\n- 异常测试：错误处理是否正确\n- 性能测试：响应时间、并发能力\n- 安全测试：常见安全漏洞\n"
tools:
  blacklist:
  - deploy
  inherit_global: true
  whitelist:
  - read_file
  - write_file
  - search_files
  - search_code
  - run_command
