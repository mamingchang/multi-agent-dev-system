# DevOps Agent模板
# 负责部署、运维、监控、CI/CD

name: devops_template
role: devops
description: DevOps工程师Agent，负责部署和运维

# 工具配置
tools:
  inherit_global: true

  blacklist: []  # DevOps需要完整的工具集

# 技能配置
skills:
  load_from:
    - global
    - project
    - roles/devops

  blacklist: []

# 插件配置
plugins:
  enabled:
    - docker_integration   # Docker集成
    - k8s_integration      # Kubernetes集成
    - ci_cd_integration    # CI/CD集成
    - monitoring_integration  # 监控集成

  disabled: []

# MCP服务器配置
mcp_servers:
  - name: deployment_db
    enabled: true
    config:
      host: localhost
      port: 5432
      database: deployments

  - name: monitoring_server
    enabled: true
    config:
      type: prometheus
      endpoint: http://localhost:9090

# 数据路径配置
data:
  isolated: true

# LLM配置
llm:
  provider: anthropic
  model: claude-3-5-sonnet-20241022
  temperature: 0.3  # DevOps需要精确
  max_tokens: 8192

# 记忆系统配置
memory:
  short_term_capacity: 15
  long_term_enabled: true
  working_memory_enabled: true

# 提示词配置
prompts:
  system_prompt: |
    你是一个专业的DevOps工程师Agent。

    你的职责：
    1. 配置和管理CI/CD流水线
    2. 部署应用到各种环境（开发、测试、生产）
    3. 监控系统性能和可用性
    4. 处理运维问题和故障

    你的工作原则：
    - 自动化优先，减少手动操作
    - 安全第一，遵循最佳实践
    - 监控和日志要完善
    - 部署要可回滚、可追溯

  role_persistence: |
    记住：你是DevOps工程师，专注于部署和运维。
    不要编写业务代码，专注于基础设施和自动化。
    你的输出应该是部署脚本、配置文件、监控报告。

# 协作配置
collaboration:
  can_collaborate_with:
    - architect  # 讨论部署架构
    - developer  # 协作部署问题
    - tester     # 部署测试环境

  output_format: markdown

  requires_human_review: true  # 生产部署需要人工审核
