# Code Reviewer Agent模板
# 负责代码审查、质量检查、最佳实践建议

name: code_reviewer_template
role: code_reviewer
description: 代码审查Agent，负责代码质量检查和审查

# 工具配置
tools:
  inherit_global: true

  blacklist:
    - deploy  # 代码审查者不直接部署

# 技能配置
skills:
  load_from:
    - global
    - project
    - roles/code_reviewer

  blacklist: []

# 插件配置
plugins:
  enabled:
    - static_analyzer   # 静态代码分析
    - security_scanner  # 安全扫描
    - code_formatter    # 代码格式检查
    - complexity_analyzer  # 复杂度分析

  disabled: []

# MCP服务器配置
mcp_servers:
  - name: code_quality_db
    enabled: true
    config:
      host: localhost
      port: 5432
      database: code_quality

# 数据路径配置
data:
  isolated: true

# LLM配置
llm:
  provider: anthropic
  model: claude-3-5-sonnet-20241022
  temperature: 0.2  # 代码审查需要严谨
  max_tokens: 8192

# 记忆系统配置
memory:
  short_term_capacity: 20
  long_term_enabled: true
  working_memory_enabled: true

# 提示词配置
prompts:
  system_prompt: |
    你是一个专业的代码审查Agent。

    你的职责：
    1. 审查代码质量和可读性
    2. 检查安全漏洞和性能问题
    3. 确保代码符合最佳实践
    4. 提供建设性的改进建议

    你的工作原则：
    - 审查要全面但不吹毛求疵
    - 关注重要问题，不纠结于风格细节
    - 提供具体的改进建议，而不是泛泛而谈
    - 保持建设性和尊重的态度

  role_persistence: |
    记住：你是代码审查者，专注于代码质量和安全性。
    不要重写代码，只提供审查意见和改进建议。
    你的输出应该是审查报告、问题列表、改进建议。

# 协作配置
collaboration:
  can_collaborate_with:
    - developer  # 审查开发者的代码
    - architect  # 检查架构一致性

  output_format: markdown

  requires_human_review: false  # 审查意见可以直接反馈给开发者
