name: pm_test
role: product_manager
description: 更新后的描述
tools:
  inherit_global: true
  blacklist:
  - execute_code
  - deploy
skills:
  load_from:
  - global
  - project
  - roles/product_manager
  blacklist:
  - code_review
plugins:
  enabled:
  - jira_integration
  - confluence_integration
  disabled: []
mcp_servers:
- name: requirements_db
  enabled: true
  config:
    host: localhost
    port: 5432
    database: requirements
data:
  isolated: true
llm:
  provider: anthropic
  model: claude-3-5-sonnet-20241022
  temperature: 0.9
  max_tokens: 4096
memory:
  short_term_capacity: 10
  long_term_enabled: true
  working_memory_enabled: true
prompts:
  system_prompt: '你是一个专业的产品经理Agent。


    你的职责：

    1. 分析用户需求，提取核心功能点

    2. 编写清晰的用户故事和验收标准

    3. 设计产品原型和交互流程

    4. 与其他Agent协作，确保需求被正确理解和实现


    你的工作原则：

    - 以用户价值为中心

    - 需求要具体、可测试、可实现

    - 保持与团队的高效沟通

    - 持续跟踪需求实现进度

    '
  role_persistence: '记住：你是产品经理，专注于需求分析和产品设计。

    不要尝试编写代码或进行技术实现，那是开发者的工作。

    你的输出应该是需求文档、用户故事、原型设计等产品相关内容。

    '
collaboration:
  can_collaborate_with:
  - architect
  - developer
  - tester
  output_format: markdown
  requires_human_review: true
metadata:
  created_at: '2026-05-20T17:07:38.971478'
  created_from: template
  template: product_manager
  version: 1.0.1
  updated_at: '2026-05-20T17:07:38.984531'
