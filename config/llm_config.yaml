# LLM配置文件
# 为每个Agent配置使用哪个LLM

# 默认配置
# 如果Agent没有单独配置，使用这个默认配置
default:
  provider: "claude"
  model: "claude-sonnet-4-5"  # 测试用模型
  temperature: 0.7
  max_tokens: 4096
  timeout: 60
  api_base: "https://plan.zetarouter.com"

# 每个Agent的单独配置
# 可以为不同Agent配置不同的LLM，实现成本优化
agents:
  # 需求分析Agent - 需要理解能力强的模型
  Requester:
    provider: "claude"
    model: "claude-sonnet-4-5"
    temperature: 0.7
    max_tokens: 2048
    api_base: "https://plan.zetarouter.com"

  # 产品经理Agent - 需要创造力
  ProductManager:
    provider: "claude"
    model: "claude-sonnet-4-5"
    temperature: 0.8  # 稍高的温度，更有创造力
    max_tokens: 4096
    api_base: "https://plan.zetarouter.com"

  # 架构师Agent - 需要逻辑严谨
  Architect:
    provider: "claude"
    model: "claude-sonnet-4-5"
    temperature: 0.5  # 较低的温度，更严谨
    max_tokens: 4096
    api_base: "https://plan.zetarouter.com"

  # 开发者Agent - 需要代码能力强
  Developer:
    provider: "claude"
    model: "claude-sonnet-4-5"
    temperature: 0.3  # 低温度，代码更准确
    max_tokens: 8192  # 更多token，因为要生成代码
    api_base: "https://plan.zetarouter.com"

  # 代码审查Agent - 需要严格
  CodeReviewer:
    provider: "claude"
    model: "claude-sonnet-4-5"
    temperature: 0.3
    max_tokens: 4096
    api_base: "https://plan.zetarouter.com"

  # 测试Agent
  Tester:
    provider: "claude"
    model: "claude-sonnet-4-5"
    temperature: 0.5
    max_tokens: 4096
    api_base: "https://plan.zetarouter.com"

  # DevOps Agent
  DevOps:
    provider: "claude"
    model: "claude-sonnet-4-5"
    temperature: 0.5
    max_tokens: 2048
    api_base: "https://plan.zetarouter.com"

# API密钥配置
# 注意：实际使用时应该从环境变量读取，不要直接写在配置文件中
api_keys:
  claude: "${ANTHROPIC_API_KEY}"  # 从环境变量读取
